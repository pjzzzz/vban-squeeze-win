#
# VBAN (Windows port)
#
# The receiver writes raw 16-bit stereo PCM at 44100 Hz to stdout; Lyrion
# forwards that to the player. FLAC is preferred for players that support it:
# the sample rate then travels inside the FLAC stream, so the player cannot
# mis-negotiate the PCM rate (which would play the stream too fast/slow).
#
vban flc * *
	# R
	[vban_url_receptor] $URL$ | [flac] -cs --totally-silent --compression-level-0 -

vban pcm * *
	# R
	[vban_url_receptor] $URL$
