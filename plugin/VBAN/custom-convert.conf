#
# VBAN (Windows port)
#
# The receiver writes raw 16-bit stereo PCM at 44100 Hz to stdout; Lyrion
# forwards that to the player. Only "pcm" is defined on purpose: every
# Squeezebox/Squeezelite player supports it natively, and it avoids the extra
# latency of an encoder.
#
vban pcm * *
	# R
	[vban_url_receptor] $URL$
