#
# VBAN (Windows port)
#
# The receiver writes raw 16-bit stereo PCM to stdout. Its output rate must
# match the rate Lyrion announces to the player, otherwise the player plays the
# stream too fast/slow. $SAMPLERATE$ is exactly the rate Lyrion derives from the
# track (and sends to the player), so the receiver follows it.
#
vban pcm * *
	# RT
	[vban_url_receptor] --target-rate=$SAMPLERATE$ $URL$
